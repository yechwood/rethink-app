name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Rethink APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build F-Droid debug APK
        run: ./gradlew assembleFdroidFullDebug --stacktrace --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: rethink-app-apk
          path: app/build/outputs/apk/fdroidFull/debug/*.apk
          if-no-files-found: error
          archive: false
          retention-days: 14
